# ═══════════════════════════════════════════════════════════════
# mini-ai 配置文件 — ~/.mini_ai/config.yaml
# ═══════════════════════════════════════════════════════════════

# ── 当前激活模型（必须对应 models 下的某个 key）──────────────
active_model: deepseek

# ── 模型定义 ──────────────────────────────────────────────────
# 每个 key 是模型名称（用于 /model 切换），包含以下字段：
#
#   必填：
#     api_url            API 地址
#     api_key            API 密钥
#     model              模型标识名
#
#   可选：
#     api_mode           协议模式，默认 openai，可选 anthropic
#     context_length     上下文窗口大小，默认 256000，建议填实际值
#     temperature        采样温度 0~2，默认 API 决定，建议代码任务 0.3、对话 0.7
#     max_tokens         单次回复最大 token 数，默认 API 决定
#     top_p              核采样概率阈值 0~1，默认 API 决定，和 temperature 二选一
#     reasoning_effort   推理等级（仅 OpenAI o 系列），默认 API 决定，可选 low/medium/high
#     headers            自定义请求头，键值对格式
models:
  claude:
    api_url: https://your-api.com/v1/messages
    api_key: your-api-key
    model: Claude Opus 4.7
    context_length: 200000       # 建议：填模型实际上下文长度
    api_mode: anthropic
    temperature: 0.3             # 建议：代码/工具场景 0.3，更稳定
    thinking:                    # 模型级覆盖（优先于全局 thinking 配置）
      enabled: true
      budget_tokens: 10000
      type: enabled              # enabled（标准）| adaptive（Bedrock 兼容）
  glm:
    api_url: https://your-api.com/v1/chat/completions
    api_key: your-api-key
    model: glm-5.1
    context_length: 200000
    # api_mode: openai           # 默认 openai，可省略
    temperature: 0.3
  deepseek:
    api_url: https://your-api.com/v1/chat/completions
    api_key: your-api-key
    model: deepseek-v4-pro
    context_length: 256000
    temperature: 0.3
    # max_tokens: 8192           # 限制单次回复长度，不设则用 API 默认
    # reasoning_effort: high     # OpenAI o 系列：low=快速、medium=平衡、high=深度推理
    # headers:                   # 可选：发送请求时附加自定义 HTTP 头
    #   X-Custom-Header: value

# ── 流式输出 ──────────────────────────────────────────────────
# true: 流式逐字输出（打字效果）；false: 等完整回复后一次显示
# 默认 true
streaming: true

# ── 超时配置 ──────────────────────────────────────────────────
timeouts:
  llm: 120              # LLM 单次请求超时（秒），默认 120，建议 120
  llm_connect: 30       # LLM 连接超时（秒），默认 30，建议 30
  llm_retries: 3        # LLM 请求失败重试次数，默认 3
  llm_retry_delay: 2    # 重试间隔（秒），默认 2
  teammate_recv: 5      # 队友消息接收超时（秒），默认 5
  lead_wait: 1800       # lead 等待队友最长时间（秒），默认 1800
  lead_poll_interval: 2 # lead 轮询间隔（秒），默认 2
  web_fetch: 20         # web_fetch 工具超时（秒），默认 20

# ── 思考模式 ──────────────────────────────────────────────────
# 全局默认思考配置，可在单个模型配置中覆盖（模型级 thinking 优先）
# 仅支持 extended thinking 的模型生效（如 Claude、DeepSeek-R1）
thinking:
  enabled: false         # 是否启用思考，默认 false，建议 true
  budget_tokens: 10000  # 思考 token 上限，默认 10000，建议 Claude 10000~30000
  type: enabled          # 思考类型，仅 Anthropic 协议生效：enabled（标准）| adaptive（Bedrock 兼容）

# ── 显示配置 ──────────────────────────────────────────────────
# 控制终端 UI 展示方式（运行时可通过 /thinking 命令切换，无需重启）
display:
  thinking_mode: collapsed   # 思维链显示方式，默认 collapsed
                              #   collapsed — 折叠，只显示摘要 "💭 已思考 N 字 (Xs)"
                              #   expanded  — 展开，实时流式显示思考内容
                              #   hidden    — 完全隐藏
  tool_detail: summary        # 工具调用显示方式，默认 summary
                              #   summary — 只显示工具名 + 耗时 + 结果摘要
                              #   full    — 显示完整参数和结果

# ── 对话压缩 ──────────────────────────────────────────────────
# 上下文过长时自动压缩：提取关键信息形成长期记忆，摘要写入文件
compactor:
  context_usage_threshold: 0.8   # prompt_tokens 占 context_length 比例超此值时触发，默认 0.8
  keep_recent: 50                # 保留最近 N 条消息不压缩，默认 50
  keep_budget_ratio: 0.2         # 压缩后保留轮次占上下文窗口比例，默认 0.2
  early_compact_ratio: 0.85      # 预压缩触发阈值相对 context_usage_threshold 的比例，默认 0.85
  max_cached_summaries: 200       # 压缩轮次摘要缓存条数上限（非上下文消息），超过时自动清理最旧轮次的摘要，防止长时间对话内存泄漏
  max_summary_sections: 50        # 压缩摘要文件保留的最大段落数，超过时截断旧段落
  context_limit: 50               # 加载到 LLM 上下文的消息条数，默认 50

# ── 队友配置 ──────────────────────────────────────────────────
# Team 协作模式下队友 Agent 的限制
teammate:
  max_teammates: 10    # 最多同时存在的队友数，默认 10
  max_turns: 20        # 队友单次任务最大工具调用轮次，默认 20
  idle_timeout: 300    # 队友空闲超时（秒），超时自动 shutdown，默认 300（5分钟），设为 0 永不退出
  max_history: 20      # 队友任务完成后保留的最近消息数，默认 20，用于多轮交互时保持上下文
  task_timeout: 600    # DAG 工作流单任务超时（秒），默认 600，可在任务节点中用 timeout 字段覆盖
  base_tools:          # 队友默认可用的工具列表（通信/黑板/dispatch_subagent 工具自动附加）
    - run_command
    - web_fetch
    - load_skill
    - read_file
    - write_file
    - edit_file
    - search_files
    - list_dir

# ── 工具配置 ──────────────────────────────────────────────────
tool:
  max_result_chars: 8000  # 工具输出最大字符数，超出截断，默认 8000
                          # 上下文大的模型可适当调大，如 16000

# ── 图片处理配置 ───────────────────────────────────────────────
image:
  max_size: 10485760          # 最大图片文件大小（字节），默认 10MB
  compress_threshold: 512000  # 压缩阈值（字节），超过则压缩，默认 500KB
  compress_max_dimension: 800 # 压缩后最大边长（像素），默认 800
  compress_quality: 85        # JPEG 压缩质量（1-100），默认 85

# ── 子代理模型映射 ─────────────────────────────────────────────
# 为特定子代理类型指定使用的模型（必须是 models 中定义的名称）
# 例如：vision 子代理使用 claude 模型处理图片分析任务
subagent_models:
  vision: claude          # vision 子代理使用 claude 模型
  # 可添加更多子代理模型映射
  # researcher: deepseek
  # planner: claude

# ── 运行器配置 ────────────────────────────────────────────────
runner:
  context_usage_limit: 0.88  # 上下文使用率警戒线，超则提前退出，默认 0.88
  max_turns: 20              # 工具循环最大轮数，超出强制退出，默认 20

# ── 计划模式 ──────────────────────────────────────────────────
# /plan 进入计划模式（只规划不执行），/act 切换回执行模式
plan:
  approval: true       # true: 需用户 /act 确认才执行；false: 自动切换执行，默认 true

# ── 日志 ──────────────────────────────────────────────────
# logging:
#   level: WARNING    # 控制台日志级别：DEBUG / INFO / WARNING / ERROR，默认 WARNING
#                      # 文件日志始终 DEBUG 级别，不受此影响
#                      # Web 模式开发建议 DEBUG，CLI 模式建议 WARNING

# ── Web 界面 ──────────────────────────────────────────────────
web:
  history_limit: 200   # 前端展示历史消息条数，默认 200

# ── 数据库配置 ──────────────────────────────────────────────────
database:
  # 历史消息数据库（SQLite）配置
  history:
    async_write: true          # 是否启用异步写入（Web 端默认 true，CLI 默认 false）
                                # 异步模式：批量写入，性能提升 74.5%
                                # 同步模式：实时持久化，适合对数据安全要求极高的场景
    batch_size: 50              # 批量写入阈值（条数），默认 50
    batch_timeout: 0.1          # 批量写入时间窗口（秒），默认 0.1（100ms）
    queue_size: 10000           # 写入队列最大容量，默认 10000
    retry_count: 3              # 写入失败重试次数，默认 3
    submit_timeout: 1.0         # 队列满时提交任务等待时间（秒），默认 1.0
    on_full: block              # 队列满策略：block=等待 submit_timeout；fail=立即报错；sync_write=退回同步写入

  # 内存数据库配置（MemoryStore）
  memory:
    cache_size: 10000           # 每个会话缓存消息数上限，默认 10000

# ── 额外技能搜索路径 ─────────────────────────────────────────
# 只读路径，安装的技能仍存放到 ~/.mini_ai/skills/
# 默认为空列表
skill_paths:
  # - /opt/shared/skills
  # - ~/my-skills

# ── MCP (Model Context Protocol) 配置 ────────────────────────
# 连接 MCP 服务器获取远程工具，自动注册为 mcp_<服务器名>_<工具名>
# 也可通过 Web 设置面板在线添加/删除 MCP 服务器
mcp:
  enabled: false           # 是否启用，默认 false
  # connect_timeout: 10    # 连接超时（秒），默认 10
  # execute_timeout: 60    # 工具执行超时（秒），默认 60
  # sse_read_timeout: 120  # SSE 读取超时（秒），默认 120
  # servers:                # MCP 服务器列表，支持配置多个
  #   memory:               # 服务器名（自定义，用于工具名前缀）
  #     type: stdio          # 传输协议：stdio（本地进程）或 streamable_http（远程服务）
  #     command: npx         # stdio: 启动命令
  #     args: ["-y", "@modelcontextprotocol/server-memory"]  # 命令参数
  #     # env:               # 可选环境变量
  #     #   API_KEY: xxx
  #     # disabled: true     # 可选，true 则跳过此服务器
  #   search:               # 另一个服务器示例
  #     type: streamable_http
  #     url: https://mcp.example.com/sse
  #     headers:             # 可选请求头
  #       Authorization: Bearer xxx
